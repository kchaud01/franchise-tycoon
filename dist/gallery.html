<title>Franchise Tycoon Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one screen. A dusk-lit district fills the left; a scoreboard-styled control panel sits on the right (below it on phones). */
:root {
  color-scheme: dark;
  --ink: #0f1622;
  --panel: #161f2d;
  --raise: #1e2a3b;
  --line: #2c3b50;
  --text: #efe8d8;
  --muted: #93a2b5;
  --gold: #ffd685;
  --good: #63d391;
  --bad: #ff8271;
  --team: #e4572e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 15px/1.45 var(--body); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3, .kicker, .btn, .tabs button, .stat b, th { font-family: var(--display); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.05; }
p { margin: 0; }
.good { color: var(--good); } .bad { color: var(--bad); }
.kicker { text-transform: uppercase; letter-spacing: .14em; font-size: 13px; font-weight: 600; color: var(--gold); }
.fine { color: var(--muted); font-size: 13px; }
.app { height: 100%; display: flex; flex-direction: column; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 9px 16px; font-size: 17px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--team); border-color: transparent; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn.ghost { background: transparent; }
.btn.small { font-size: 14px; padding: 6px 11px; }
.btn.wide, .btn.big { width: 100%; }
.btn.big { font-size: 21px; padding: 13px 16px; }

/* setup */
.setup { flex: 1; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, #131b33 0%, #2a2e57 48%, #6a4a6c 78%, #c58560 100%); overflow: auto; }
.setup-card { width: min(100%, 480px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.setup-card h1 { font-size: clamp(44px, 11vw, 64px); font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
.setup-body { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.lede { color: #cfd6df; }
label { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--muted); }
.connect { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; margin-top: 6px; }
input, select { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; flex: 1; width: 100%; }
.error { color: var(--bad); }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; height: 1px; flex: 1; background: var(--line); }
.pick { display: flex; flex-direction: column; gap: 6px; }
.pickrow { text-align: left; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; }
.pickrow:hover { border-color: var(--gold); }
.pickrow span { color: var(--muted); font-size: 13px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; }
.swatch.on { border-color: #fff; box-shadow: 0 0 0 2px var(--ink) inset; }

/* game shell */
.game { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.hud { display: flex; align-items: center; gap: 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; border-left: 4px solid var(--team); padding-left: 10px; }
.brand b { font: 700 22px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.brand span { color: var(--muted); font-size: 12px; }
.stats { display: flex; gap: 22px; flex: 1; flex-wrap: wrap; justify-content: flex-end; }
.stat { display: flex; flex-direction: column; min-width: 56px; }
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stat b { font-size: 22px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat.bad b { color: var(--bad); }
.meter { display: block; height: 5px; background: var(--ink); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--team), var(--gold)); border-radius: 3px; }
.stat .meter { width: 64px; }
.hud-actions { display: flex; gap: 6px; position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-width: 210px; z-index: 5; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
.menu button { background: none; border: 0; text-align: left; padding: 10px 14px; }
.menu button:hover { background: var(--line); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
.board { position: relative; min-height: 0; background:
  radial-gradient(1px 1px at 12% 14%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 31% 8%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 58% 11%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 77% 6%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 90% 19%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 45% 21%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 6% 30%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 69% 26%, #fff 50%, transparent 51%),
  linear-gradient(180deg, #111830 0%, #262b55 42%, #5e466c 72%, #c58560 100%); }
.board.day { background: linear-gradient(180deg, #4f97d1 0%, #8fc4e8 55%, #d9e6dc 100%); }
#city { width: 100%; height: 100%; display: block; touch-action: manipulation; }
.visit { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; background: rgba(22, 31, 45, .92); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 8px; padding: 8px 10px; }
.visit div { display: flex; flex-direction: column; min-width: 0; padding: 0 6px; }
.visit span { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); }
.visit b { font: 700 20px/1.1 var(--display); text-transform: uppercase; overflow-wrap: anywhere; }
.visit em { font-style: normal; font-size: 12.5px; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.linkbtn:hover { color: var(--gold); }
.zoom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 38px; height: 34px; background: rgba(22, 31, 45, .85); border: 1px solid var(--line); border-radius: 6px; font: 600 17px var(--display); }
.zoom button:hover { border-color: var(--muted); }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; min-width: 0; background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 2px 9px; font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; color: var(--muted); }
.tabs button.on { color: var(--text); border-bottom-color: var(--team); }
.panel { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px; }

.card { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.card h2 { font-size: 30px; font-weight: 700; text-transform: uppercase; overflow-wrap: anywhere; }
.card h2 small { font-size: 16px; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.card h3 { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.card.match { border-top: 3px solid var(--team); }
.pill { align-self: flex-start; background: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; font-size: 13px; color: var(--gold); }
.linkline { color: var(--gold); font-size: 14px; }
.notice { text-align: center; }

.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 104px 1fr 62px; gap: 8px; align-items: center; font-size: 13px; }
.bar span { color: var(--muted); }
.bar > i { height: 8px; background: var(--ink); border-radius: 4px; overflow: hidden; }
.bar > i > i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button, .promos button, .options button { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.seg button b, .promos button b, .options button b { font: 600 17px/1.15 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.seg button span, .promos button span, .options button span { font-size: 12.5px; color: var(--muted); }
.seg button.on, .promos button.on { border-color: var(--team); box-shadow: inset 0 0 0 1px var(--team); }
.seg button:hover:not(:disabled), .promos button:hover:not(:disabled), .options button:hover:not(:disabled) { border-color: var(--muted); }
.promos, .options { display: flex; flex-direction: column; gap: 6px; }
.promos button, .options button { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; }
.promos button span, .options button span { grid-column: 1 / -1; }
.promos em, .options em, .catalog em { font: 600 15px var(--display); font-style: normal; color: var(--gold); }
.options .syn.good, dd.good { color: var(--good); }

.live { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.live div { background: var(--ink); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.live span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.live b { font: 700 28px/1.1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }

.catalog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.catalog li { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; }
.catalog b { font: 600 16px var(--display); text-transform: uppercase; letter-spacing: .03em; }
.catalog span { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.facts { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.facts div { display: grid; grid-template-columns: 84px 1fr; gap: 8px; font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 4px 6px; }
td { padding: 6px; border-top: 1px solid var(--line); }
th:nth-child(n+3), td:nth-child(n+3) { text-align: right; white-space: nowrap; }
tr.me td { color: var(--gold); font-weight: 600; }
tr.me td:first-child { box-shadow: inset 3px 0 0 var(--team); }

.histrow { display: grid; grid-template-columns: 46px auto 1fr auto; gap: 8px; align-items: baseline; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 2px; text-align: left; font-size: 14px; }
.histrow:hover { background: var(--ink); }
.histrow span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.histrow b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.histrow em { font: 600 16px var(--display); font-style: normal; }
.badges { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.badges li { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14px; }
.badges li b { font-weight: 500; }
.badges li.got { color: var(--gold); }
.badges li.got b::before { content: "✓ "; }

/* league mode */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slider { display: flex; align-items: center; gap: 12px; }
.slider input { flex: 1; padding: 0; accent-color: var(--team); background: none; border: 0; }
.slider output { font: 700 30px/1 var(--display); color: var(--gold); min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font: 14px var(--body); color: var(--text); }
.check input { width: auto; flex: none; accent-color: var(--team); }
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weeknav h3 { text-align: center; }
.invites { display: flex; flex-direction: column; gap: 8px; }
.invite { display: flex; flex-direction: column; gap: 3px; }
.invite .row { flex-wrap: nowrap; }
.invite input { font-size: 12px; padding: 6px 8px; }
.adj { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.adj div { display: flex; flex-direction: column; min-width: 0; }
.adj span { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.adj b { font: 700 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.adj em { font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.adj p { grid-column: 1 / -1; color: var(--gold); font-size: 13px; }
.adj.flip b { color: var(--gold); }

/* mini-games */
.mini { z-index: 30; }
.mini-body { width: min(100%, 420px); }
.mini-title { font-size: 34px; font-weight: 700; text-transform: uppercase; }
.mini-body canvas { width: 100%; max-width: 360px; aspect-ratio: 360 / 440; align-self: center; border-radius: 8px; border: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; background: var(--ink); }
.mini-foot { display: flex; flex-direction: column; gap: 8px; }
.mini-result { display: flex; flex-direction: column; gap: 2px; background: var(--raise); border-radius: 8px; padding: 10px 12px; }
.mini-result b { font: 700 30px/1.1 var(--display); background: none; padding: 0; }
.mini-result span { color: var(--gold); font-size: 14px; }
.medal { font: 700 12px var(--display); font-style: normal; text-transform: uppercase; letter-spacing: .1em; border-radius: 3px; padding: 1px 6px; color: var(--ink); background: var(--muted); vertical-align: middle; }
.medal.m1 { background: #c98a5a; } .medal.m2 { background: #cfd6dd; } .medal.m3 { background: var(--gold); }
.mini-result b.medal { color: var(--text); background: none; padding: 0; font-size: 30px; letter-spacing: 0; }
.mini-result b.m1 { color: #dda06f; } .mini-result b.m2 { color: #dfe5ea; } .mini-result b.m3 { color: var(--gold); }
.minih { color: var(--text) !important; font-size: 20px !important; letter-spacing: .03em !important; }
.minis { display: flex; flex-direction: column; gap: 6px; }
.minis button { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; text-align: left; display: grid; grid-template-columns: 1fr auto; column-gap: 10px; min-width: 0; }
.minis button:hover { border-color: var(--muted); }
.minis b { font: 600 17px/1.15 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.minis em { font: 600 14px var(--display); font-style: normal; color: var(--gold); }
.minis span { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }

/* game-day report */
.modal { position: fixed; inset: 0; background: rgba(8, 12, 20, .72); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-body { width: min(100%, 560px); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--team); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.final { font-size: clamp(40px, 10vw, 58px); font-weight: 700; text-transform: uppercase; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.final span { color: var(--text); font-variant-numeric: tabular-nums; }
.vs { color: var(--muted); margin-top: -8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { background: var(--raise); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 13px; }
.gate { display: flex; flex-direction: column; gap: 5px; }
.gatehead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.gatehead span { color: var(--muted); }
.gate .meter { height: 9px; }
.stamp { font: 700 13px var(--display); font-style: normal; text-transform: uppercase; letter-spacing: .12em; color: var(--ink); background: var(--gold); border-radius: 3px; padding: 1px 6px; margin-left: 4px; }
.lines td { vertical-align: top; }
.lines td:first-child { text-align: left; white-space: normal; }
.lines td:last-child { text-align: right; white-space: nowrap; font: 600 18px var(--display); }
.lines td span { display: block; color: var(--muted); font-size: 12.5px; }
.lines tfoot td { border-top: 2px solid var(--muted); font-size: 16px; }
.lines tfoot td:last-child { font-size: 24px; }
.deltas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.deltas > div { background: var(--raise); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.deltas span { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.deltas b { display: block; font: 700 26px/1.1 var(--display); }
.deltas ul { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; color: #cfd6df; }
.deltas em { font-style: normal; font-variant-numeric: tabular-nums; display: inline-block; min-width: 38px; }
.won { background: rgba(255, 214, 133, .1); border: 1px solid var(--gold); border-radius: 8px; padding: 9px 12px; color: var(--gold); }
.won em { font-style: normal; font-weight: 600; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { min-height: 100%; }
  main { display: flex; flex-direction: column; }
  .board { height: min(72vw, 520px); flex: none; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .panel { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stats { justify-content: flex-start; gap: 14px 18px; order: 3; flex-basis: 100%; }
  .hud { gap: 10px; }
  .hud-actions { margin-left: auto; }
  .stat b { font-size: 19px; }
}
@media (prefers-reduced-motion: no-preference) {
  .modal-body { animation: rise .28s ease-out; }
  @keyframes rise { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
}

html, body { height: auto; }
.gal { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 30px; }
.gal header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.gal h1 { font-size: clamp(38px, 8vw, 58px); font-weight: 700; text-transform: uppercase; }
.gal header p { color: var(--muted); max-width: 60ch; }
.controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.toggle { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.toggle button { background: none; border: 0; padding: 7px 14px; font: 600 15px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.toggle button.on { background: var(--team); color: #fff; }
.gal section { display: flex; flex-direction: column; gap: 10px; }
.gal section > h2 { font-size: 28px; font-weight: 700; text-transform: uppercase; border-left: 4px solid var(--team); padding-left: 10px; }
.gal section > p { color: var(--muted); max-width: 75ch; }
.gal section > p.linkline { color: var(--gold); }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.lv { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.lv canvas { width: 100%; height: 250px; display: block; background: linear-gradient(180deg, #4f97d1 0%, #8fc4e8 60%, #cfe2dc 100%); }

.lv div { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }

</style>
<div class="gal" id="gal">
  <header>
    <div>
      <p class="kicker">Franchise Tycoon</p>
      <h1>Building gallery</h1>
      <p>Every building at each of its three levels, and the stadium at all five. These are drawn by the game itself, so this is exactly what appears in your district.</p>
    </div>
    <div class="controls">
      <div class="toggle" role="group" aria-label="Time of day">
        <button id="t-day" data-night="0">Afternoon</button>
        <button id="t-night" data-night="1">Night game</button>
      </div>
      <div class="swatches" id="colors" role="group" aria-label="Team colour"></div>
    </div>
  </header>
  <div id="sections"></div>
</div>
<script>
/* Franchise Tycoon — game engine. Pure logic, no DOM. Runs in the browser and in Node (tests). */
(function (root) {
  'use strict';
  const FT = (root.FT = root.FT || {});

  const GRID = 5;
  const STADIUM_TILES = ['1-1', '1-2', '2-1', '2-2'];
  const key = (r, c) => r + '-' + c;
  const isStadium = (k) => STADIUM_TILES.indexOf(k) >= 0;

  // ---- Catalog -------------------------------------------------------------
  // cost[level-1] is the price to reach that level. `v` is the per-level effect value.
  const BUILDINGS = {
    concessions: {
      name: 'Concessions', cost: [180e3, 420e3, 950e3], v: [2.5, 5, 8.5],
      blurb: 'Food and drink sales per fan in the building on home game days.',
      link: 'Scales with your fantasy score against the league median that week.',
      synergy: 'Next to the stadium: +20%',
      unit: (v) => '$' + v.toFixed(2) + ' per fan',
    },
    transit: {
      name: 'Transit Hub', cost: [220e3, 520e3, 1.2e6], v: [8e3, 18e3, 32e3],
      blurb: 'Parking and rail. Raises how many fans can physically reach the stadium.',
      link: 'Matters most when hype is high and the stadium would otherwise sell out the roads.',
      synergy: 'On the outer edge of the district: +10%',
      unit: (v) => '+' + Math.round(v / 1e3) + 'k fan access',
    },
    retail: {
      name: 'Team Store', cost: [260e3, 600e3, 1.4e6], v: [0.6, 1.3, 2.2],
      blurb: 'Merchandise sold to your whole fanbase every week, home or away.',
      link: 'Each starter who scores 20+ fantasy points adds 30% (jersey sales). Wins add 15%.',
      synergy: 'Next to a Transit Hub or Fan Plaza: +15% each (max +30%)',
      unit: (v) => '$' + v.toFixed(2) + ' per fan in the fanbase',
    },
    suites: {
      name: 'VIP Suites', cost: [600e3, 1.4e6, 3.2e6], v: [45e3, 100e3, 190e3],
      blurb: 'Corporate boxes leased on home game days.',
      link: 'Lease rates follow your league standing: 150% in 1st place down to 60% in last. Doubled in the playoffs.',
      synergy: 'Next to the stadium: +25%',
      unit: (v) => '$' + Math.round(v / 1e3) + 'k base per home game',
    },
    media: {
      name: 'Broadcast Center', cost: [450e3, 1e6, 2.4e6], v: [30e3, 65e3, 120e3],
      blurb: 'TV and streaming rights paid every week, home or away.',
      link: 'Close games (decided by under 10) pay +40%. Shootouts pay +30%. Night games pay +25%. Playoff games pay +50%.',
      synergy: 'Next to the stadium: +20%',
      unit: (v) => '$' + Math.round(v / 1e3) + 'k base per week',
    },
    fanzone: {
      name: 'Fan Plaza', cost: [240e3, 560e3, 1.3e6], v: [3, 6, 10],
      blurb: 'Watch parties earn money on away weeks, and good news travels further.',
      link: 'Boosts every hype gain by 10% per level. Away weeks: a fifth of your fanbase shows up to watch.',
      synergy: 'Next to Concessions: +15% each (max +30%)',
      unit: (v) => '$' + v + ' per watch-party fan',
    },
    medical: {
      name: 'Performance Center', cost: [350e3, 800e3, 1.8e6], v: [0.3, 0.55, 0.8],
      blurb: 'Sports medicine and training. Keeps the fanbase calm when things go wrong.',
      link: 'Cuts the hype hit from starters who bust (under 4 points) and softens losses by 10% per level.',
      synergy: 'No placement bonus',
      unit: (v) => Math.round(v * 100) + '% less bust damage',
    },
    scouting: {
      name: 'Front Office', cost: [300e3, 700e3, 1.6e6], v: [600, 1300, 2200],
      blurb: 'Scouts and analysts. Turns roster depth into money and grows the fanbase faster.',
      link: 'Pays for every point your bench scores. Fanbase growth +8% per level.',
      synergy: 'No placement bonus',
      unit: (v) => '$' + v + ' per bench point',
    },
  };
  const TYPES = Object.keys(BUILDINGS);

  const STADIUM = {
    cap: [18e3, 28e3, 40e3, 55e3, 72e3],
    cost: [0, 1.2e6, 3e6, 7e6, 15e6],
    name: ['Community Field', 'County Bowl', 'Metro Stadium', 'Grand Arena', 'Skyline Dome'],
  };
  const PRICES = [
    { id: 0, name: 'Value', price: 12, turnout: 1.15, hype: 1 },
    { id: 1, name: 'Standard', price: 20, turnout: 1, hype: 0 },
    { id: 2, name: 'Premium', price: 30, turnout: 0.8, hype: -1 },
  ];
  const PROMOS = {
    none: { name: 'No promotion', cost: 0, text: 'Save the money.' },
    giveaway: { name: 'Bobblehead Night', cost: 40e3, text: '+15% turnout at a home game.' },
    guarantee: { name: 'Guarantee a Win', cost: 0, text: 'Win: +8 hype and +20% merch. Lose: -8 hype.' },
    shootout: { name: 'Shootout Special', cost: 25e3, text: 'Beat the league median score: concessions and watch parties +50%.' },
  };
  const BASE_ACCESS = 14e3;
  const START_CASH = 700e3;
  const START_FANS = 20e3;
  const PAYROLL = 60e3;
  const SHARE = 110e3;
  const NIGHT_RATE = 38; // percent of regular-season games played at night
  const SALT = 281; // chosen so home and away weeks alternate reasonably
  const UPKEEP_RATE = 0.025;
  const STAR_PTS = 20;
  const BUST_PTS = 4;

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const dim = (vals) => vals.slice().sort((a, b) => b - a).reduce((s, v, i) => s + v / (1 + 0.4 * i), 0);

  // ---- League helpers --------------------------------------------------------
  function median(nums) {
    if (!nums.length) return 0;
    const s = nums.slice().sort((a, b) => a - b);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  function opponentOf(wk, rid) {
    const me = wk.teams[rid];
    if (!me || me.mid == null) return null;
    for (const id in wk.teams) if (+id !== +rid && wk.teams[id].mid === me.mid) return +id;
    return null;
  }
  /** Regular-season standings through `through` (inclusive). Returns {rid: {w,l,t,pf,rank}}. */
  function standings(league, through) {
    const tab = {};
    league.teams.forEach((t) => (tab[t.rosterId] = { rid: t.rosterId, w: 0, l: 0, t: 0, pf: 0 }));
    const last = Math.min(through, (league.playoffStart || 99) - 1);
    for (let w = 1; w <= last; w++) {
      const wk = league.weeks[w];
      if (!wk || !wk.complete) continue;
      for (const id in wk.teams) {
        const opp = opponentOf(wk, +id);
        if (opp == null || !tab[id]) continue;
        const a = wk.teams[id].pts, b = wk.teams[opp].pts;
        tab[id].pf += a;
        if (a > b) tab[id].w++; else if (a < b) tab[id].l++; else tab[id].t++;
      }
    }
    const order = Object.values(tab).sort((a, b) => (b.w + b.t / 2) - (a.w + a.t / 2) || b.pf - a.pf || a.rid - b.rid);
    order.forEach((r, i) => (r.rank = i + 1));
    return tab;
  }
  const teamName = (league, rid) => {
    const t = league.teams.find((x) => x.rosterId === rid);
    return t ? t.name : 'Bye';
  };

  /** Who hosts and whether it is a night game: a coin flip both sides of a matchup agree on. */
  function slot(week, rid, oppId) {
    const lo = Math.min(rid, oppId), hi = Math.max(rid, oppId);
    let x = SALT ^ Math.imul(week, 73856093) ^ Math.imul(lo, 19349663) ^ Math.imul(hi, 83492791);
    x ^= x >>> 16; x = Math.imul(x, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16;
    let y = Math.imul(x ^ 0x9e3779b9, 0x85ebca6b); y ^= y >>> 15; y = Math.imul(y, 0xc2b2ae35); y ^= y >>> 13;
    return { home: ((x & 1) === 0) === (rid === lo), night: ((y >>> 0) % 100) < NIGHT_RATE };
  }
  /** The fixture for a week, known before any points are scored. Null when the week has no data yet. */
  function matchup(league, week, rid) {
    const wk = league.weeks[week], me = wk && wk.teams[rid];
    if (!me) return null;
    const oppId = opponentOf(wk, rid);
    if (oppId == null) return { week, bye: true, oppId: null, oppName: 'Bye', home: false, night: false, playoff: false, pts: me.pts, oppPts: 0 };
    const sl = slot(week, rid, oppId);
    return { week, bye: false, oppId, oppName: teamName(league, oppId), home: sl.home, night: !!me.playoff || sl.night, playoff: !!me.playoff, pts: me.pts, oppPts: wk.teams[oppId].pts };
  }
  /** League-mode bonus points. Each row compares an owner's weekly net with an auto-pilot twin that had the same
      fantasy result, so the table rewards decisions and not the fantasy score itself.
      rows: [{rid, net, twinNet, twinGross}] -> adds edge (percent), beaten, bonus. Ties share the lower bonus.
      payout: 'all' (sliding scale down to zero for last place), 'half' (top half only) or 'top3'. */
  function bonusTable(rows, cap, payout) {
    const out = rows.map((r) => Object.assign({}, r, { edge: Math.round(((r.net - r.twinNet) / Math.max(1, r.twinGross)) * 1000) / 10 }));
    const n = out.length;
    out.forEach((r) => {
      r.beaten = out.filter((o) => o.edge < r.edge).length;
      // k = how many places are paid: everyone but last, the top half, or the top three
      const k = Math.max(1, Math.min(n - 1, payout === 'top3' ? 3 : payout === 'half' ? Math.ceil(n / 2) : n - 1));
      const step = r.beaten - (n - k) + 1;
      r.bonus = n > 1 && step > 0 ? Math.round((cap * step / k) * 10) / 10 : 0;
    });
    return out.sort((a, b) => b.edge - a.edge || a.rid - b.rid);
  }

  // ---- Trades ---------------------------------------------------------------------------
  const REPLACEMENT = 8; // a player averaging this many points is easy to replace, so fans do not care
  /** A player's scoring average over finished weeks before `before`, counting only weeks they scored. */
  function playerAvg(league, id, before) {
    let g = 0, t = 0;
    for (let w = 1; w < before; w++) {
      const p = league.ppw && league.ppw[w] && league.ppw[w][id];
      if (p > 0 && league.weeks[w] && league.weeks[w].complete) { g++; t += p; }
    }
    return g ? t / g : 0;
  }
  /** What a team's trades in `week` did to its star power. Null when it made none.
      net = points-per-game above replacement gained minus given up. Draft picks are ignored. */
  function tradeImpact(league, week, rid) {
    const list = (league.trades && league.trades[week]) || [];
    const got = [], gave = [];
    let net = 0;
    const item = (id) => { const avg = playerAvg(league, id, week); return { id, n: (league.players && league.players[id] && league.players[id].n) || '', avg: Math.round(avg * 10) / 10, v: Math.max(0, avg - REPLACEMENT) }; };
    list.forEach((tr) => {
      if (tr.rosters.indexOf(rid) < 0) return;
      for (const id in tr.adds || {}) if (tr.adds[id] === rid) { const it = item(id); got.push(it); net += it.v; }
      for (const id in tr.drops || {}) if (tr.drops[id] === rid) { const it = item(id); gave.push(it); net -= it.v; }
    });
    if (!got.length && !gave.length) return null;
    const byAvg = (a, b) => b.avg - a.avg;
    return { net: Math.round(net * 10) / 10, in: got.sort(byAvg), out: gave.sort(byAvg) };
  }

  /** Everything the sim needs to know about one team's fantasy week. */
  function weekResult(league, week, rid) {
    const wk = league.weeks[week];
    if (!wk || !wk.complete) return null;
    const me = wk.teams[rid];
    if (!me) return null;
    const oppId = opponentOf(wk, rid);
    const n = league.teams.length;
    const st = standings(league, week)[rid] || { rank: n, w: 0, l: 0, t: 0 };
    const scores = Object.values(wk.teams).map((t) => t.pts).filter((p) => p > 0);
    const res = {
      season: league.season, week, rid, bye: oppId == null, playoff: !!me.playoff,
      pts: me.pts, oppId, oppPts: 0, oppName: 'Bye', win: false, tie: false, margin: 0,
      median: median(scores), rank: st.rank, n, record: st.w + '-' + st.l + (st.t ? '-' + st.t : ''),
      night: false, stars: 0, busts: 0, top: null, benchPts: me.bench || 0, home: false, trade: tradeImpact(league, week, rid),
    };
    (me.starters || []).forEach(([id, p]) => {
      if (p >= STAR_PTS) res.stars++;
      if (p < BUST_PTS) res.busts++;
      if (!res.top || p > res.top.pts) res.top = { id, pts: p };
    });
    if (oppId != null) {
      res.oppPts = wk.teams[oppId].pts;
      res.oppName = teamName(league, oppId);
      res.win = res.pts > res.oppPts;
      res.tie = res.pts === res.oppPts;
      res.margin = Math.abs(res.pts - res.oppPts);
      const sl = slot(week, rid, oppId);
      res.home = sl.home;
      res.night = res.playoff || sl.night;
    }
    return res;
  }

  // ---- Franchise state ---------------------------------------------------------
  function newFranchise(rid) {
    return {
      rid, cash: START_CASH, fans: START_FANS, hype: 50, stadium: 1, grid: {},
      price: 1, promo: 'none', streak: 0, invested: 0, sellouts: 0, wins: 0, losses: 0,
    };
  }
  function newGame(league, opts) {
    const s = newFranchise(league.myRosterId);
    s.v = 1;
    s.name = (opts && opts.name) || teamName(league, league.myRosterId);
    s.color = (opts && opts.color) || '#e4572e';
    s.played = {};
    s.history = [];
    s.badges = {};
    s.rivals = {};
    league.teams.forEach((t) => {
      if (t.rosterId !== league.myRosterId) s.rivals[t.rosterId] = newFranchise(t.rosterId);
    });
    return s;
  }

  function neighbors(k) {
    const [r, c] = k.split('-').map(Number);
    return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]
      .filter(([a, b]) => a >= 0 && b >= 0 && a < GRID && b < GRID)
      .map(([a, b]) => key(a, b));
  }
  const nearStadium = (k) => neighbors(k).some(isStadium);
  const onEdge = (k) => { const [r, c] = k.split('-').map(Number); return r === 0 || c === 0 || r === GRID - 1 || c === GRID - 1; };

  /** Placement multiplier for a building of `type` on lot `k`. */
  function synergy(s, k, type) {
    const adj = neighbors(k).map((n) => (s.grid[n] ? s.grid[n].type : null));
    const count = (t) => adj.filter((a) => a === t).length;
    switch (type) {
      case 'concessions': return nearStadium(k) ? 1.2 : 1;
      case 'suites': return nearStadium(k) ? 1.25 : 1;
      case 'media': return nearStadium(k) ? 1.2 : 1;
      case 'transit': return onEdge(k) ? 1.1 : 1;
      case 'retail': return 1 + Math.min(0.3, 0.15 * (count('transit') + count('fanzone')));
      case 'fanzone': return 1 + Math.min(0.3, 0.15 * count('concessions'));
      default: return 1;
    }
  }

  /** Aggregate building effects for a franchise. */
  function effects(s) {
    const by = {};
    TYPES.forEach((t) => (by[t] = []));
    let levels = 0;
    for (const k in s.grid) {
      const b = s.grid[k];
      const mini = (s.mini && s.mini[b.type] && s.mini[b.type].boost) || 0; // this week's mini-game medal
      by[b.type].push(BUILDINGS[b.type].v[b.level - 1] * synergy(s, k, b.type) * (1 + mini));
      levels += b.level;
    }
    const lv = (t) => Object.values(s.grid).filter((b) => b.type === t).reduce((a, b) => a + b.level, 0);
    return {
      capacity: STADIUM.cap[s.stadium - 1],
      access: BASE_ACCESS + by.transit.reduce((a, b) => a + b, 0),
      perCap: dim(by.concessions),
      merch: dim(by.retail),
      suites: dim(by.suites),
      media: dim(by.media),
      party: dim(by.fanzone),
      hypeBoost: 1 + Math.min(0.5, 0.1 * lv('fanzone')),
      bustCut: Math.min(0.9, by.medical.reduce((a, b) => a + b, 0)),
      lossCut: Math.min(0.4, 0.1 * lv('medical')),
      bench: dim(by.scouting),
      growth: 1 + 0.08 * lv('scouting'),
      upkeep: Math.round(s.invested * UPKEEP_RATE) + PAYROLL,
      levels,
    };
  }

  const turnoutRate = (s) => (0.25 + 0.6 * (s.hype / 100)) * PRICES[s.price].turnout;
  function forecast(s) {
    const e = effects(s);
    const demand = Math.round(s.fans * turnoutRate(s));
    return { demand, capacity: e.capacity, access: e.access, attendance: Math.min(demand, e.capacity, e.access), e };
  }

  function value(s) {
    return Math.round(s.cash + s.invested * 0.7 + s.fans * 25 + s.hype * 10e3);
  }

  // ---- Actions -------------------------------------------------------------------
  function canAfford(s, cost) { return s.cash >= cost; }
  function build(s, k, type) {
    if (isStadium(k) || s.grid[k] || !BUILDINGS[type]) return false;
    const cost = BUILDINGS[type].cost[0];
    if (!canAfford(s, cost)) return false;
    s.cash -= cost; s.invested += cost;
    s.grid[k] = { type, level: 1 };
    return true;
  }
  function upgrade(s, k) {
    const b = s.grid[k];
    if (!b || b.level >= 3) return false;
    const cost = BUILDINGS[b.type].cost[b.level];
    if (!canAfford(s, cost)) return false;
    s.cash -= cost; s.invested += cost; b.level++;
    return true;
  }
  function spentOn(b) { return BUILDINGS[b.type].cost.slice(0, b.level).reduce((a, c) => a + c, 0); }
  function refund(b) { return Math.round(spentOn(b) * 0.4); }
  function demolish(s, k) {
    const b = s.grid[k];
    if (!b) return false;
    s.cash += refund(b); s.invested -= spentOn(b);
    delete s.grid[k];
    return true;
  }
  function upgradeStadium(s) {
    if (s.stadium >= 5) return false;
    const cost = STADIUM.cost[s.stadium];
    if (!canAfford(s, cost)) return false;
    s.cash -= cost; s.invested += cost; s.stadium++;
    return true;
  }

  // ---- Travelling fans ------------------------------------------------------------------
  /** How many of the away owner's fans follow the team to the host's stadium. Hype is the main driver; a Transit
      Hub and a win streak add to it. The host stadium only offers a fifth of its seats to visitors. */
  function travelers(away, host) {
    const transit = Object.values(away.grid).filter((b) => b.type === 'transit').reduce((a, b) => a + b.level, 0);
    const rate = 0.01 + 0.05 * (away.hype / 100) + 0.005 * Math.min(4, transit) + (away.streak >= 3 ? 0.01 : 0);
    return Math.round(Math.min(away.fans * rate, STADIUM.cap[host.stadium - 1] * 0.2));
  }
  /** Tag each team's result with its travelling support. Call before any franchise is settled, so both sides of a
      matchup are measured from the same pre-game state. results: {rid: weekResult}, franchises: {rid: franchise}. */
  function attachTravel(results, franchises) {
    for (const rid in results) {
      const r = results[rid], me = franchises[rid], opp = r && franchises[r.oppId];
      if (!r || r.bye || !me || !opp) continue;
      r.travel = r.home ? { in: travelers(opp, me), from: r.oppId } : { out: travelers(me, opp) };
    }
  }

  // ---- Weekly settlement -------------------------------------------------------------
  // ---- Mini-games -----------------------------------------------------------------------
  // One arcade game per building. A medal boosts that building's output for the coming game day only.
  // tiers = score needed for bronze, silver, gold (for `lower` games, the time to beat).
  const MINI = {
    concessions: { game: 'pour', name: 'Perfect Pour', unit: 'points', tiers: [8, 14, 20], how: 'Hold to pour and let go on the green line. A dead-on pour counts double, a spill counts nothing. 25 seconds.' },
    transit: { game: 'shuttle', name: 'Shuttle Run', unit: 'fans', tiers: [10, 16, 22], how: 'Tap the left or right side (or use the arrow keys) to change lanes. Pick up fans and stay off the cones. 25 seconds.' },
    retail: { game: 'order', name: 'Rush Order', unit: 'orders', tiers: [12, 17, 22], how: 'Tap the jersey that matches the order. A wrong jersey costs you time. 25 seconds.' },
    suites: { game: 'stack', name: 'Sky Suite Stacker', unit: 'floors', tiers: [6, 10, 15], how: 'Tap to drop each floor. Anything hanging over the edge is cut off, and a miss ends the build.' },
    media: { game: 'signal', name: 'Signal Lock', unit: '% locked', tiers: [40, 58, 74], how: 'Hold to raise the needle, let go to drop it. Keep it inside the moving band for 20 seconds.' },
    fanzone: { game: 'kick', name: 'Field Goal Frenzy', unit: 'of 5', tiers: [2, 3, 5], how: 'Tap once to set your aim, again to set power. The green zone already allows for the wind. Five kicks, each one narrower.' },
    medical: { game: 'dash', name: 'Combine Dash', unit: 'seconds', lower: true, tiers: [10, 7.5, 6], how: 'Alternate left and right taps (or arrow keys) to run 40 yards. Hitting the same side twice makes you stumble.' },
    scouting: { game: 'scout', name: "Scout's Eye", unit: 'of 10', tiers: [5, 7, 9], how: 'Three prospects with three ratings each. Tap the one with the best total before the clock runs out. Ten rounds, each faster.' },
  };
  const MINI_TRIES = 3;
  const MINI_BOOST = [0, 0.04, 0.07, 0.1];
  const MEDALS = ['No medal', 'Bronze', 'Silver', 'Gold'];
  /** 0 = no medal, 1 = bronze, 2 = silver, 3 = gold. */
  function miniMedal(type, score) {

  // Five different venues: grass-berm field, concrete bowl, double-deck stadium with a canopy,

    poly(ctx, [D, Cc, [Cc[0], Cc[1] + depth], [D[0], D[1] + depth]], gl);
    const gr = ctx.createLinearGradient(0, B[1], 0, Cc[1] + depth);
    gr.addColorStop(0, tone('#5d4032')); gr.addColorStop(1, tone('#2b1d18'));
    poly(ctx, [Cc, B, [B[0], B[1] + depth], [Cc[0], Cc[1] + depth]], gr);
    poly(ctx, [D, Cc, [Cc[0], Cc[1] + 5], [D[0], D[1] + 5]], '#356b4d');
    poly(ctx, [Cc, B, [B[0], B[1] + 5], [Cc[0], Cc[1] + 5]], '#28543c');
    poly(ctx, [A, B, Cc, D], C.grass);
    const sq = (a, b, fill, stroke) => poly(ctx, [P(a, a), P(b, a), P(b, b), P(a, b)], fill, stroke);
    const tier = this.state.stadium;         // the town grows up with the stadium
    sq(-2.04, G + 2.04, '#39745a');          // town blocks sit on slightly darker turf
    sq(-1.0, G + 1.0, tier === 1 ? '#6f9a62' : tier >= 4 ? '#c9c4b8' : C.walk);   // verge, then sidewalk, then paving
    sq(-0.84, G + 0.84, tier === 1 ? '#9a8562' : C.asphalt);                      // dirt road, then asphalt
    sq(-0.2, G + 0.2, C.walk);               // district sidewalk
    sq(-0.07, G + 0.07, '#262d38');          // district streets
    if (tier >= 2) { ctx.save(); ctx.setLineDash([7, 7]); ctx.globalAlpha = 0.7; sq(-0.52, G + 0.52, null, tier >= 4 ? '#e9edf2' : C.line); ctx.restore(); }
    if (tier < 3) return; // crosswalks arrive with the town
    // crosswalks at the middle of each side
    const zebra = 'rgba(238,241,244,.8)';
    for (let k = 0; k < 5; k++) {
      const a = 2.28 + k * 0.1;
      poly(ctx, [P(a, -0.82), P(a + 0.05, -0.82), P(a + 0.05, -0.22), P(a, -0.22)], zebra);
      poly(ctx, [P(a, G + 0.22), P(a + 0.05, G + 0.22), P(a + 0.05, G + 0.82), P(a, G + 0.82)], zebra);
      poly(ctx, [P(-0.82, a), P(-0.22, a), P(-0.22, a + 0.05), P(-0.82, a + 0.05)], zebra);
      poly(ctx, [P(G + 0.22, a), P(G + 0.82, a), P(G + 0.82, a + 0.05), P(G + 0.22, a + 0.05)], zebra);
    }
  };

  /** A point on a square loop around the district. m0 = offset of the back edge, u in [0,4): one unit per side. */
  function loopPos(u, m0) {
    const L = G - 2 * m0, s = Math.floor(u) % 4, f = u - Math.floor(u);
    if (s === 0) return { x: m0 + f * L, y: m0, along: 'x', back: true };
    if (s === 1) return { x: m0 + L, y: m0 + f * L, along: 'y', back: false };
    if (s === 2) return { x: m0 + L - f * L, y: m0 + L, along: 'x', back: false };
    return { x: m0, y: m0 + L - f * L, along: 'y', back: true };
  }

  R.draw = function () {
    const ctx = this.ctx, S = this.state, t = this.t;
    NIGHT = !!this.night; FLOOD = false;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    if (!S) return;
    ctx.setTransform(this.dpr * this.scale, 0, 0, this.dpr * this.scale, this.dpr * this.ox, this.dpr * this.oy);
    this.drawGround(ctx);
    // moving things, each tagged with the layer it belongs to
    const cars = [], palette = ['#e4572e', '#f2b33d', '#e8e2d0', '#4f8fd9', '#3aa88f', '#b06ab3'];
    const busy = BUSY[S.stadium - 1];
    for (let i = 0; i < busy[0]; i++) cars.push(Object.assign(loopPos((i * 0.447 + t * (0.004 + (i % 3) * 0.0012)) % 4, -0.52), { col: palette[i % palette.length] }));
    const walkers = [];
    for (let i = 0; i < busy[1]; i++) {
      const outer = i % 3 !== 0, dir = i % 2 ? 1 : -1, sp = 0.0009 + hash(i, 7) * 0.0009;
      const u = (((hash(i, 3) * 4 + dir * t * sp) % 4) + 4) % 4;
      const lane = outer ? -0.92 + (i % 4) * 0.02 - 0.03 : -0.135 + (i % 2) * 0.03;
      walkers.push(Object.assign(loopPos(u, lane), { i, outer }));
    }
    const lamps = [];
    for (let s = 0; s < 4; s++) for (let k = 0; k < busy[2]; k++) lamps.push(loopPos(s + (k + 0.5) / busy[2], -0.97));
    const rim = [];
    for (let i = 0; i < 40; i++) {
      const side = i % 4, f = hash(i, 9) * (G + 2 * E - 0.3) - E + 0.15, off = E - 0.11;
      const p = side === 0 ? [f, -off] : side === 1 ? [G + off, f] : side === 2 ? [f, G + off] : [-off, f];
      rim.push({ x: p[0], y: p[1], s: 0.45 + hash(i, 2) * 0.3, back: side === 0 || side === 3 });
    }
    rim.sort((p, q) => p.x + p.y - q.x - q.y);
    const byDepth = (p, q) => p.x + p.y - q.x - q.y;

    rim.filter((p) => p.back).forEach((p) => tree(ctx, p.x, p.y, p.s));
    this.drawTown(ctx, true);
    lamps.filter((p) => p.back).forEach((p) => lamp(ctx, p.x, p.y));
    walkers.filter((p) => p.back).sort(byDepth).forEach((p) => person(ctx, p.x, p.y, p.i, t));
    cars.filter((c) => c.back).forEach((c) => car(ctx, c.x, c.y, c.along, c.col));
    // lots back to front; the stadium sits at depth 4, in front of the back rows and behind the front rows
    const order = [];
    for (let r = 0; r < G; r++) for (let c = 0; c < G; c++) if (!FT.isStadium(r + '-' + c)) order.push([r, c]);
    order.sort((p, q) => p[0] + p[1] - q[0] - q[1] || p[1] - q[1]);
    let stadiumDone = false;
    order.forEach(([r, c]) => {
      if (!stadiumDone && r + c > 3) { FLOOD = NIGHT; this.drawStadium(ctx); FLOOD = false; stadiumDone = true; } // floodlit at night
      this.drawLot(ctx, r, c);
    });
    walkers.filter((p) => !p.back && !p.outer).sort(byDepth).forEach((p) => person(ctx, p.x, p.y, p.i, t));
    cars.filter((c) => !c.back).forEach((c) => car(ctx, c.x, c.y, c.along, c.col));
    walkers.filter((p) => !p.back && p.outer).sort(byDepth).forEach((p) => person(ctx, p.x, p.y, p.i, t));
    lamps.filter((p) => !p.back).forEach((p) => lamp(ctx, p.x, p.y));
    this.drawTown(ctx, false);
    rim.filter((p) => !p.back).forEach((p) => tree(ctx, p.x, p.y, p.s));
    // fireworks
    this.particles = this.particles.filter((p) => p.life > 0);
    FLOOD = true;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    this.particles.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 1;
      ctx.globalAlpha = Math.max(0, p.life / 40); ctx.fillStyle = p.col; ctx.fillRect(p.x - 1.2, p.y - 1.2, 2.4, 2.4);
    });
    ctx.restore();
  };

  R.fireworks = function (n) {
    const cols = [this.state.color, '#ffd685', '#ffffff', '#7fd4ff'];
    for (let b = 0; b < (n || 5); b++) {
      const x = -220 + Math.random() * 440, y = -150 + Math.random() * 110, col = cols[b % cols.length];
      setTimeout(() => {
        for (let i = 0; i < 46; i++) { const an = Math.random() * 6.283, sp = 0.6 + Math.random() * 2.6; this.particles.push({ x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 0.6, life: 30 + Math.random() * 22, col }); }
      }, b * 260);
    }
  };

  R.start = function () {
    const still = root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let last = 0;
    const loop = (now) => {
      this.raf = root.requestAnimationFrame(loop);
      if (now - last < (still ? 400 : 40)) return;
      last = now;
      if (!still) this.t += 1;
      this.draw();
    };
    this.raf = root.requestAnimationFrame(loop);
  };

  /** Draw one building (or the stadium, type 'stadium') on its own canvas. Used by the gallery page. */
  FT.drawPreview = function (canvas, type, level, color, night) {
    if (type === 'town') {
      const r = canvas.townRenderer || (canvas.townRenderer = new Renderer(canvas));
      canvas.toneHooked = true;
      r.state = { color, stadium: level, grid: {} }; r.night = !!night; r.fill = 0.85; r.t = 67; r.score = '27-24';
      r.resize(); r.zoom = 1.12; r.applyView(); r.draw();
      return;
    }
    const dpr = Math.min(2, root.devicePixelRatio || 1), w = canvas.clientWidth || 220, h = canvas.clientHeight || 180;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    if (!canvas.toneHooked) { hookTone(ctx); canvas.toneHooked = true; }
    NIGHT = !!night; FLOOD = false;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
    const S = { color, stadium: level, grid: {} }, fake = { state: S, t: 67, fill: 0.85, score: '27-24', selected: null, hover: null, gameDay: false };
    if (type === 'stadium') {
      const sc = Math.min(w / 250, h / 190);
      ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * w / 2, dpr * (h / 2 - 96 * sc));
      FLOOD = NIGHT;
      R.drawStadium.call(fake, ctx);
    } else {
      const tall = heightOf({ type, level });
      const sc = Math.min(2.1, w / 135, (h - 16) / (tall + 72));
      ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * w / 2, dpr * (h - 8 - 62 * sc));
      box(ctx, 0.06, 0.06, 0.88, 0.88, 0, 2, C.walk);
      DRAW[type](ctx, 0, 0, level, S, fake.t, fake);
    }
    FLOOD = false;
  };

  FT.Renderer = Renderer;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Franchise Tycoon — gallery page. Lists every building level with the game's own art and numbers. */
(function () {
  'use strict';
  const FT = window.FT;
  const COLORS = ['#e4572e', '#f2b33d', '#3aa88f', '#4f8fd9', '#b06ab3', '#d9436b', '#5aa845', '#d8d2c2'];
  let color = COLORS[0], night = false;
  const money = (n) => '$' + (n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 2 : 0) + 'M' : Math.round(n / 1e3) + 'k');
  const card = (type, lv, title, lines, wide) => '<div class="lv' + (wide ? ' wide' : '') + '"><canvas data-type="' + type + '" data-lv="' + lv + '" role="img" aria-label="' + title + '"></canvas><div><b>' + title + '</b>' + lines.map((l, i) => (i ? '<span>' : '<em>') + l + (i ? '</span>' : '</em>')).join('') + '</div></div>';

  let h = '<section><h2>Stadium</h2><p>The centre of the district. It grows from a grass-banked community field into a concrete bowl, a double-deck stadium with a canopy, a roofed arena behind glass, and finally a fully enclosed dome.</p><div class="levels">';
  FT.STADIUM.name.forEach((name, i) => { h += card('stadium', i + 1, 'Level ' + (i + 1) + ' · ' + name, [i ? money(FT.STADIUM.cost[i]) + ' to expand' : 'Where you start', FT.STADIUM.cap[i].toLocaleString() + ' seats'], true); });
  h += '</div></section>';
  const TOWNS = ['Farm village', 'Small town', 'Town', 'City', 'Metropolis'];
  const TOWN_NOTES = ['Fields, barns, a general store and a dirt road.', 'Houses, a diner, a school and a town hall on a paved road.', 'Offices, apartments, a library, street lamps and crosswalks.', 'Towers on the skyline, townhouses and busier streets.', 'Glass skyscrapers, condos, a museum, a galleria and a gilded city hall.'];
  h += '<section><h2>The town around you</h2><p>The scenery outside your district is tied to the stadium. Each expansion brings a bigger, busier and richer town.</p><div class="levels towns">';
  TOWNS.forEach((name, i) => { h += card('town', i + 1, name, ['With the level ' + (i + 1) + ' stadium', TOWN_NOTES[i]], true); });
  h += '</div></section>';
  FT.TYPES.forEach((t) => {
    const b = FT.BUILDINGS[t];
    h += '<section><h2>' + b.name + '</h2><p>' + b.blurb + '</p><p class="linkline">' + b.link + '</p><div class="levels">';
    b.cost.forEach((c, i) => { h += card(t, i + 1, 'Level ' + (i + 1), [money(c) + (i ? ' to upgrade' : ' to build'), b.unit(b.v[i]), i === 0 ? b.synergy : '']); });
    h += '</div></section>';
  });
  document.getElementById('sections').innerHTML = h;
  document.getElementById('sections').style.cssText = 'display:flex;flex-direction:column;gap:30px';
  document.getElementById('colors').innerHTML = COLORS.map((c) => '<button class="swatch" style="background:' + c + '" data-color="' + c + '" aria-label="Team colour ' + c + '"></button>').join('');

  function paint() {
    document.getElementById('gal').classList.toggle('night', night);
    document.documentElement.style.setProperty('--team', color);
    document.getElementById('t-day').classList.toggle('on', !night);
    document.getElementById('t-night').classList.toggle('on', night);
    document.querySelectorAll('.swatch').forEach((s) => s.classList.toggle('on', s.dataset.color === color));
    document.querySelectorAll('canvas[data-type]').forEach((c) => FT.drawPreview(c, c.dataset.type, +c.dataset.lv, color, night));
  }
  document.addEventListener('click', (e) => {
    const n = e.target.closest('[data-night]'), c = e.target.closest('[data-color]');
    if (n) night = n.dataset.night === '1';
    if (c) color = c.dataset.color;
    if (n || c) paint();
  });
  window.addEventListener('resize', paint);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
  paint();
})();
</script>
