# Deploys the game to Cloud Run on every push to main (see README, "Automatic deploys").
# Builds the Dockerfile, pushes the image to the repository Cloud Run's source deploys created,
# then rolls the existing service onto it. The service keeps its settings, server key and data bucket.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', '${_SERVICE}', '--image', '${_IMAGE}', '--region', '${_REGION}', '--quiet']
substitutions:
  _SERVICE: franchise-tycoon
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/franchise-tycoon:${BUILD_ID}
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
images: ['${_IMAGE}']
